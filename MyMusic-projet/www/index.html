<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f0f10"><title>MyMusic</title>
<style>
:root{--bg:#0f0f10;--s:#1a1a1c;--s2:#26262a;--g:#d4af37;--t:#f2f0ea;--m:#8d8b86}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:16px 20px 6px;font-size:22px;font-weight:700;letter-spacing:.5px}header b{color:var(--g);font-weight:700}
main{flex:1;overflow:auto;padding:8px 16px 150px}
.r{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;cursor:pointer}.r:active{background:var(--s)}
.r img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--s2)}.i{flex:1;min-width:0}.i div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.i small,.m{color:var(--m)}
input[type=text],input:not([type]){width:100%;background:var(--s);border:1px solid var(--s2);color:var(--t);padding:14px 16px;border-radius:14px;font-size:15px;outline:0;margin:6px 0 10px}input:focus{border-color:var(--g)}
.btn{background:var(--g);color:#111;border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:14px}.card{background:var(--s);border:1px solid var(--s2);border-radius:16px;padding:16px;margin:8px 0;line-height:1.5}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#141416;border-top:1px solid var(--s2);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;background:0;border:0;color:var(--m);padding:14px;font-size:13px;letter-spacing:.5px}nav .on{color:var(--g)}
#mini{position:fixed;left:10px;right:10px;bottom:calc(52px + env(safe-area-inset-bottom));background:var(--s2);border:1px solid #33333a;border-radius:16px;display:none;align-items:center;gap:10px;padding:8px}#mini img{width:44px;height:44px;border-radius:8px}
button.ic{background:0;border:0;color:var(--t);font-size:22px;padding:8px 12px}.g{color:var(--g)}
#sh{position:fixed;inset:0;background:var(--bg);transform:translateY(100%);transition:transform .3s;padding:calc(env(safe-area-inset-top) + 12px) 20px 20px;display:flex;flex-direction:column;z-index:5}#sh.open{transform:none}
#vw{aspect-ratio:16/9;width:100%;border-radius:16px;overflow:hidden;background:#000;margin:10px 0;border:1px solid var(--s2)}#vw iframe{width:100%;height:100%}
#st{font-size:20px;font-weight:700;margin-top:10px}input[type=range]{width:100%;accent-color:var(--g);margin:18px 0 4px}.ct{display:flex;justify-content:space-around;align-items:center;margin-top:10px}.ct .pl{background:var(--g);color:#111;border-radius:50%;width:68px;height:68px;font-size:24px;padding:0}
#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--g);color:#111;padding:10px 16px;border-radius:12px;font-weight:600;display:none;z-index:9;max-width:90%}
</style></head><body>
<header><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.5"><circle cx="12" cy="12" r="11"/><path d="M10.5 16V8l5-1.5V14"/><circle cx="9" cy="16" r="1.5"/><circle cx="14" cy="14" r="1.5"/></svg>My<b>Music</b></header>
<main id="mn"></main>
<div id="mini"><img id="ma"><div class="i" id="mt" style="flex:1"></div><button class="ic" id="mp">▶︎</button></div>
<nav><button data-t="s">RECHERCHE</button><button data-t="f">FAVORIS</button><button data-t="g">RÉGLAGES</button></nav>
<div id="sh"><div style="display:flex;justify-content:space-between"><button class="ic" id="cl">⌄</button><span class="m" style="padding:12px">Lecture en cours</span><button class="ic" id="fv">♡</button></div>
<div id="vw"><div id="yt"></div></div><div id="st"></div><div class="m" id="sa"></div>
<input type="range" id="sk" min="0" max="1000" value="0"><div class="m" style="display:flex;justify-content:space-between"><span id="c1">0:00</span><span id="c2">0:00</span></div>
<div class="ct"><button class="ic" id="sf">⇄</button><button class="ic" id="pv">⏮︎</button><button class="ic pl" id="pp">▶︎</button><button class="ic" id="nx">⏭︎</button><button class="ic" id="rp">↻</button></div></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage[k])||d}catch(e){return d}},S=(k,v)=>localStorage[k]=JSON.stringify(v);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=window.Capacitor,PB=C&&C.registerPlugin?C.registerPlugin('Playback'):null,AP=C&&C.Plugins&&C.Plugins.App;
let key=L('key',''),fav=L('fav',[]),res=L('last',[]),q=[],ix=-1,P,ready=0,tab='s',sh=0,rp=0,sf=0,qs='',stt=-1,open_=0;
const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const dur=i=>{const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(i);return(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0)};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e.t);e.t=setTimeout(()=>e.style.display='none',3200)}
const rows=(l,n)=>l.length?l.map((t,i)=>`<div class="r" data-l="${n}" data-i="${i}"><img src="${esc(t.i)}"><div class="i"><div>${esc(t.t)}</div><small>${esc(t.a)}${t.d?' · '+fmt(t.d):''}</small></div></div>`).join(''):'<p class="m" style="padding:20px 4px">Rien ici pour le moment.</p>';
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 const m=$('#mn');
 if(tab=='s')m.innerHTML=`<input id="qi" placeholder="Titre, artiste ou lien YouTube…" value="${esc(qs)}">${rows(res,'s')}`;
 else if(tab=='f')m.innerHTML=`<h3 style="margin:10px 4px">Mes favoris</h3>${rows(fav,'f')}`;
 else m.innerHTML=`<div class="card"><b class="g">Clé API YouTube</b><input id="ki" placeholder="Colle ta clé ici" value="${esc(key)}"><button class="btn" id="ks">Enregistrer</button></div>
 <div class="card m"><b class="g">Obtenir une clé (gratuit)</b><br>1. console.cloud.google.com → nouveau projet<br>2. Activer « YouTube Data API v3 »<br>3. Identifiants → Créer une clé API (restriction : uniquement l’API YouTube Data, pas d’app Android)<br>Quota gratuit : environ 100 recherches par jour. Sans clé, tu peux quand même coller un lien YouTube.</div>`;
 const qi=$('#qi');if(qi){qi.oninput=()=>qs=qi.value;qi.onkeydown=e=>{if(e.key=='Enter'){qi.blur();find(qi.value.trim())}}}
 const ks=$('#ks');if(ks)ks.onclick=()=>{key=$('#ki').value.trim();S('key',key);toast('Clé enregistrée')}
}
async function find(t){
 if(!t)return;const m=t.match(/(?:v=|youtu\.be\/|shorts\/)([\w-]{11})/),id=m&&m[1];
 if(!key){if(!id){tab='g';render();return toast('Ajoute ta clé API dans Réglages')}
  res=[{id,t:'Vidéo YouTube',a:id,d:0,i:`https://i.ytimg.com/vi/${id}/mqdefault.jpg`}];render();return play(res,0)}
 try{let ids=id;
  if(!id){const r=await(await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoCategoryId=10&videoEmbeddable=true&maxResults=25&q=${encodeURIComponent(t)}&key=${key}`)).json();if(r.error)throw r.error.message;ids=r.items.map(x=>x.id.videoId).join()}
  const r=await(await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,contentDetails,status&id=${ids}&key=${key}`)).json();if(r.error)throw r.error.message;
  res=r.items.filter(x=>x.status.embeddable).map(x=>({id:x.id,t:x.snippet.title,a:x.snippet.channelTitle,d:dur(x.contentDetails.duration),i:x.snippet.thumbnails.medium.url}));
  S('last',res);render();if(id&&res[0])play(res,0)}catch(e){toast('Erreur : '+e)}
}
function play(l,i){q=l;ix=i;load()}
function load(){const t=q[ix];if(!t)return;if(!ready)return toast('Lecteur en chargement, réessaie');
 P.loadVideoById(t.id);ui();if(PB)PB.start({title:t.t}).catch(()=>{})}
function ui(){const t=q[ix];if(!t)return;$('#mini').style.display='flex';$('#ma').src=t.i;$('#mt').innerHTML=`<div>${esc(t.t)}</div><small class="m">${esc(t.a)}</small>`;$('#st').textContent=t.t;$('#sa').textContent=t.a;$('#fv').textContent=fav.some(f=>f.id==t.id)?'♥':'♡';$('#fv').classList.toggle('g',fav.some(f=>f.id==t.id))}
function next(auto){if(!q.length)return;let n=sf?Math.floor(Math.random()*q.length):ix+1;if(n>=q.length){if(rp||!auto)n=0;else{return}}ix=n;load()}
function prev(){if(P&&P.getCurrentTime()>3)return P.seekTo(0,true);ix=ix>0?ix-1:q.length-1;load()}
function pp(){if(!P||ix<0)return;stt==1?P.pauseVideo():P.playVideo()}
function tog(v){sh=v;$('#sh').classList.toggle('open',!!v)}
window.onYouTubeIframeAPIReady=()=>{P=new YT.Player('yt',{width:'100%',height:'100%',playerVars:{playsinline:1,controls:0,rel:0,origin:location.origin,widget_referrer:location.origin},events:{onReady:()=>ready=1,
 onStateChange:e=>{stt=e.data;if(stt==0)next(true);const g=stt==1?'❚❚':'▶︎';$('#pp').textContent=g;$('#mp').textContent=g},
 onError:()=>{toast('Piste indisponible, suivante…');next(true)}}})};
setInterval(()=>{if(P&&ready&&stt==1){const c=P.getCurrentTime(),d=P.getDuration();$('#c1').textContent=fmt(c);$('#c2').textContent=fmt(d);if(!open_)$('#sk').value=d?c/d*1000:0}},500);
$('#sk').oninput=e=>{open_=1;$('#c1').textContent=fmt(e.target.value/1000*P.getDuration())};$('#sk').onchange=e=>{P.seekTo(e.target.value/1000*P.getDuration(),true);open_=0};
$('#pp').onclick=pp;$('#mp').onclick=e=>{e.stopPropagation();pp()};$('#nx').onclick=()=>next(false);$('#pv').onclick=prev;$('#mini').onclick=()=>tog(1);$('#cl').onclick=()=>tog(0);
$('#sf').onclick=e=>{sf=!sf;e.target.classList.toggle('g',sf)};$('#rp').onclick=e=>{rp=!rp;e.target.classList.toggle('g',rp)};
$('#fv').onclick=()=>{const t=q[ix];if(!t)return;fav=fav.some(f=>f.id==t.id)?fav.filter(f=>f.id!=t.id):[...fav,t];S('fav',fav);ui();if(tab=='f')render()};
$('#mn').onclick=e=>{const r=e.target.closest('.r');if(r)play(r.dataset.l=='f'?fav:res,+r.dataset.i)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
if(AP)AP.addListener('backButton',()=>{if(sh)tog(0);else if(tab!='s'){tab='s';render()}else AP.exitApp()});
render();
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
